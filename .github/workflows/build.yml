name: GhostLock-S26 Device Build

# Manually builds a GhostLock APK + the ksud daemon tailored to a specific
# Galaxy S26 device / SoC / kernel line.
#
#   device      -> m1q/m2q/m3q (Snapdragon), m1s/m2s (Exynos), or the whole family
#   processor   -> snapdragon / exynos / both (filters the kernel lines at build time)
#   kernel_line -> pin the exact params line (cn / intl / exynos) instead of auto
#   tailor      -> prune exploit/src/params_table.c + ParamsTable.kt to only the
#                  selected device/line so the payload ignores everything else
#   rebuild_ksud-> rebuild the ksud daemon + kernelsu.ko from polygraphene/KernelSU
#                  (the S26/KDP-hardened fork; click "Run" on the use of it below),
#                  or keep the vendored prebuilt in app/src/main/assets/ksud.
#   ksud_ref    -> polygraphene/KernelSU git commit used to (re)build ksud
#   kmi         -> target Kernel Module Interface (android16-6.12 = S26 GKI 6.12)
#   ddk_release -> ylarod/ddk-min image snapshot used for the kernelsu.ko build
#   samsung_hardening -> build with CONFIG_KSU_SAMSUNG_KDP/RKP/DEFEX=y so the
#                        module speaks Samsung kdp creds + RKP/DEFEX sync on 6.12
#   no_patch_text -> disable live text patching (Exynos EL2; see "Exynos 2400" in
#                    the BuSung-dev payloads README)
#   sign_release-> sign the release APK with KEYSTORE_BASE64/KEY_ALIAS/... secrets
#
# Pipeline:
#   build-ksud    builds kernelsu.ko inside the KMI DDK container (Samsung KDP/
#                 RKP/DEFEX flags), drops it into userspace/ksud/bin/aarch64/,
#                 then cross-compiles ksud for arm64 with NDK r29 so the late-load
#                 binary embeds the module (or snapshots the vendored prebuilt)
#                 -> uploads a ksud+kernelsu.ko artifact + SHA-256
#   build-android overlays that ksud, runs .github/scripts/tailor.py (if tailoring),
#                 cross-builds exploit/ with the NDK (preload.so + su_daemon),
#                 stages assets and assembles the APK with Gradle.

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device codename (build target)"
        type: choice
        required: true
        default: all
        options:
          - all       # whole S26 family (17 tested builds)
          - m1q       # Galaxy S26        (SM-S942x) Snapdragon
          - m2q       # Galaxy S26+       (SM-S947x) Snapdragon
          - m3q       # Galaxy S26 Ultra  (SM-S948x) Snapdragon
          - m1s       # Galaxy S26        (SM-S942B) Exynos
          - m2s       # Galaxy S26+       (SM-S947B) Exynos
      processor:
        description: "Processor type / SoC family"
        type: choice
        required: true
        default: all
        options:
          - all             # both Snapdragon and Exynos
          - snapdragon      # cn + intl kernel lines
          - exynos          # exynos kernel line
      kernel_line:
        description: "Kernel parameter line (auto = derived from device/processor)"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - cn
          - intl
          - exynos
      build_type:
        description: "Android build type"
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release
      tailor:
        description: "Prune params tables to only the selected device/line (smaller single-target payload)"
        type: boolean
        required: false
        default: false
      rebuild_ksud:
        description: "Rebuild ksud + kernelsu.ko from polygraphene/KernelSU source (off = use vendored prebuilt)"
        type: boolean
        required: false
        default: true
      ksud_ref:
        description: "polygraphene/KernelSU git ref used to (re)build ksud + kernelsu.ko"
        type: string
        required: false
        default: a5531763971cf034e3f630d31654189a148e5f81
      kmi:
        description: "Target KMI the kernelsu.ko is compiled for (S26 = android16-6.12)"
        type: choice
        required: false
        default: android16-6.12
        options:
          - android16-6.12
          - android15-6.6
      ddk_release:
        description: "ylarod/ddk-min snapshot used for the kernelsu.ko build"
        type: string
        required: false
        default: "20260313"
      samsung_hardening:
        description: "Build kernelsu.ko with CONFIG_KSU_SAMSUNG_KDP/RKP/DEFEX=y (Samsung kdp creds, RKP/DEFEX sync)"
        type: boolean
        required: false
        default: true
      no_patch_text:
        description: "Disable live text patching (required for Samsung Exynos EL2 targets, see BuSung-dev payloads README)"
        type: boolean
        required: false
        default: false
      sign_release:
        description: "Sign the release APK with KEYSTORE_BASE64/KEY_ALIAS/KEYSTORE_PASSWORD/KEY_PASSWORD secrets"
        type: boolean
        required: false
        default: false

concurrency:
  group: ghostlock-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  KSUD_TARGET: aarch64-linux-android          # ksud ABI (S26 family is arm64-only)
  NDK_DIR: 27.0.12077973                      # NDK r27c (native exploit payloads)

jobs:
  build-ksud:
    name: ksud + kernelsu.ko (${{ inputs.ksud_ref }}, ${{ inputs.rebuild_ksud && 'rebuild' || 'vendored' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ksud_sha256: ${{ steps.sha.outputs.value }}
    steps:
      - name: Checkout (for vendored fallback)
        uses: actions/checkout@v4

      - name: Pick ksud build method
        id: method
        run: |
          if [ "${{ inputs.rebuild_ksud }}" = "true" ]; then
            echo "method=source" >> "$GITHUB_OUTPUT"
          else
            echo "method=vendored" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout polygraphene/KernelSU at ksud_ref
        if: steps.method.outputs.method == 'source'
        uses: actions/checkout@v4
        with:
          repository: polygraphene/KernelSU
          ref: ${{ inputs.ksud_ref }}
          path: kernelsu
          fetch-depth: 0

      - name: Build kernelsu.ko (KMI DDK container, Samsung KDP/RKP/DEFEX)
        if: steps.method.outputs.method == 'source'
        env:
          KMI: ${{ inputs.kmi }}
          DDK_RELEASE: ${{ inputs.ddk_release }}
          SAMSUNG_HARDENING: ${{ inputs.samsung_hardening }}
          NO_PATCH_TEXT: ${{ inputs.no_patch_text }}
        run: |
          set -eu
          KSU_CONFIG="CONFIG_KSU=m"
          if [ "$SAMSUNG_HARDENING" = "true" ]; then
            KSU_CONFIG="$KSU_CONFIG CONFIG_KSU_SAMSUNG_KDP=y CONFIG_KSU_SAMSUNG_RKP=y CONFIG_KSU_SAMSUNG_DEFEX=y"
          fi
          if [ "$NO_PATCH_TEXT" = "true" ]; then
            KSU_CONFIG="$KSU_CONFIG CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y"
          fi
          echo "KSU_CONFIG=$KSU_CONFIG"
          docker run --rm \
            -v "$PWD/kernelsu:/workspace/kernelsu" \
            -w /workspace/kernelsu/kernel \
            -e KSU_CONFIG="$KSU_CONFIG" \
            -e KMI="${KMI}" \
            "ghcr.io/ylarod/ddk-min:${KMI}-${DDK_RELEASE}" \
            bash -lc '
              set -eu
              echo "== KDIR=$KDIR =="
              echo "== building with: env $KSU_CONFIG make =="
              env $KSU_CONFIG make
              echo "== stripping + embedding =="
              llvm-strip -d kernelsu.ko
              echo "== vermagic =="
              llvm-readelf -p .modinfo kernelsu.ko 2>/dev/null | grep -i vermagic || true
              mkdir -p /workspace/kernelsu/userspace/ksud/bin/aarch64
              cp kernelsu.ko "/workspace/kernelsu/userspace/ksud/bin/aarch64/${KMI}_kernelsu.ko"
            '
          ls -l "kernelsu/userspace/ksud/bin/aarch64/${KMI}_kernelsu.ko"

      - name: Snapshot vendored ksud
        if: steps.method.outputs.method == 'vendored'
        run: |
          cp app/src/main/assets/ksud ./ksud
          echo "source=vendored (checked-in asset)" >> "$GITHUB_ENV"

      - name: Repoint Cargo git deps (Kernel-SU -> KernelSU2 org rename)
        if: steps.method.outputs.method == 'source'
        run: |
          cd kernelsu
          MANIFESTS="userspace/ksud/Cargo.toml userspace/ksuinit/Cargo.toml"
          before=$(grep -hc "github.com/Kernel-SU/" $MANIFESTS | awk '{s+=$1} END{print s+0}')
          sed -i 's#github.com/Kernel-SU/#github.com/KernelSU2/#g' $MANIFESTS
          after=$(grep -hc "github.com/KernelSU2/" $MANIFESTS | awk '{s+=$1} END{print s+0}')
          echo "Cargo git deps repointed: $before -> $after (expect 4 live under KernelSU2)"
          test "$before" -gt 0

      - name: Set up Rust toolchain
        if: steps.method.outputs.method == 'source'
        run: |
          rustup update stable
          rustup target add "$KSUD_TARGET"

      - name: Install libclang (bindgen for ksud uapi headers)
        if: steps.method.outputs.method == 'source'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libclang-dev clang

      - name: Set up Android NDK r29
        if: steps.method.outputs.method == 'source'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build ksud (cargo + NDK r29, polygraphene/KernelSU fork)
        if: steps.method.outputs.method == 'source'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cd kernelsu
          source .github/scripts/setup-rust-build.sh "$KSUD_TARGET" 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
          cd ..
          cp "$PWD/kernelsu/target/$KSUD_TARGET/release/ksud" ./ksud
          echo "source=${{ inputs.ksud_ref }}" >> "$GITHUB_ENV"

      - name: Package ksud artifact
        id: sha
        run: |
          file ksud
          SHA=$(sha256sum ksud | cut -d' ' -f1)
          echo "value=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "ksud-target=$KSUD_TARGET"
            echo "ksud-repo=polygraphene/KernelSU"
            echo "ksud-ref=${{ inputs.ksud_ref }}"
            echo "ksud-source=$source"
            echo "kmi=${{ inputs.kmi }}"
            echo "ksud-sha256=$SHA"
            if [ -f "kernelsu/userspace/ksud/bin/aarch64/${{ inputs.kmi }}_kernelsu.ko" ]; then
              echo "ksud-embeds=${{ inputs.kmi }}_kernelsu.ko"
              echo "kernelsu-ko-sha256=$(sha256sum kernelsu/userspace/ksud/bin/aarch64/${{ inputs.kmi }}_kernelsu.ko | cut -d' ' -f1)"
            fi
          } > ksud-provenance.txt
          mkdir -p dist
          cp ksud dist/ksud
          cp ksud-provenance.txt dist/ksud-provenance.txt
          if [ -f "kernelsu/userspace/ksud/bin/aarch64/${{ inputs.kmi }}_kernelsu.ko" ]; then
            cp "kernelsu/userspace/ksud/bin/aarch64/${{ inputs.kmi }}_kernelsu.ko" \
               "dist/${{ inputs.kmi }}_kernelsu.ko"
          fi

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksud
          path: dist/

  build-android:
    name: GhostLock APK (${{ inputs.build_type }})
    needs: build-ksud
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target matrix
        id: matrix
        run: |
          python3 .github/scripts/tailor.py \
            --device "${{ inputs.device }}" \
            --processor "${{ inputs.processor }}" \
            --kernel-line "${{ inputs.kernel_line }}" \
            $( [ "${{ inputs.tailor }}" = "true" ] && echo --tailor ) \
            > matrix.json
          cat matrix.json
          LINES="$(python3 -c 'import json;print(",".join(json.load(open("matrix.json"))["lines"]))')"
          DEVICES="$(python3 -c 'import json;print(",".join(json.load(open("matrix.json"))["devices"]))')"
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "devices=$DEVICES" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Download ksud
        uses: actions/download-artifact@v4
        with:
          name: ksud
          path: ksud-artifact

      - name: Overlay ksud into app assets
        run: |
          cp ksud-artifact/ksud app/src/main/assets/ksud
          chmod 644 app/src/main/assets/ksud
          sha256sum app/src/main/assets/ksud

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK (cmdline-tools 16.0 on ubuntu-24.04 drops the legacy
            "tools" package, so install exactly what AGP needs directly)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set -eu
          for l in "$ANDROID_HOME"/licenses/android-sdk-license*; do
            test -f "$l" || continue
          done
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platform-tools" "tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0" \
            >/dev/null 2>&1 || {
              echo "::warning::legacy 'tools' not installable on cmdline-tools 16.0; installing the AGP-required components without it"
              yes | "$SDKM" --install \
                "platform-tools" \
                "platforms;android-35" \
                "build-tools;34.0.0" "build-tools;35.0.0" >/dev/null
            }
          test -d "$ANDROID_HOME/platforms/android-35"
          ls "$ANDROID_HOME/build-tools/"

      - name: Install Android NDK (for native payloads)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;$NDK_DIR" >/dev/null
          test -d "$ANDROID_HOME/ndk/$NDK_DIR"

      - name: Build native payloads (exploit Makefile, NDK clang)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_DIR }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_DIR }}
        run: |
          cd exploit
          make preload
          cd ..
          ls -l exploit/build/bin/preload.so exploit/build/embed/su_daemon_aarch64_pie

      - name: Stage assets into the APK
        run: ./stage-assets.sh

      - name: Assemble APK
        run: |
          ./gradlew :app:assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} \
            --console=plain
          ls -l app/build/outputs/apk/${{ inputs.build_type }}

      - name: "Warn: release will be unsigned"
        if: ${{ inputs.sign_release == 'true' && env.KEYSTORE_BASE64 == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "::warning::sign_release=true but KEYSTORE_BASE64 is not set - uploading an unsigned release APK"

      - name: Sign release APK (optional)
        if: ${{ inputs.build_type == 'release' && inputs.sign_release == 'true' && env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "::group::Signing release APK"
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          BUILD_TOOLS="$ANDROID_HOME/build-tools"
          APKSIGNER="$(find "$BUILD_TOOLS" -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$BUILD_TOOLS" -name zipalign | sort -V | tail -1)"
          RELEASE_DIR=app/build/outputs/apk/release
          "$ZIPALIGN" -f -p 4 "$RELEASE_DIR/app-release-unsigned.apk" "$RELEASE_DIR/app-release-aligned.apk"
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$RELEASE_DIR/app-release.apk" \
            "$RELEASE_DIR/app-release-aligned.apk"
          "$APKSIGNER" verify --print-certs "$RELEASE_DIR/app-release.apk"
          echo "::endgroup::"

      - name: Package artifacts
        run: |
          set -eu
          mkdir -p dist
          LINES="${{ steps.matrix.outputs.lines }}"
          DEVICES="${{ steps.matrix.outputs.devices }}"
          LABEL="$(python3 -c 'import json; print(json.load(open("matrix.json"))["tailored"] and "tailored" or "full")')"

          if [ "${{ inputs.build_type }}" = "release" ]; then
            RELEASE_DIR=app/build/outputs/apk/release
            if [ -f "$RELEASE_DIR/app-release.apk" ]; then
              APK="$RELEASE_DIR/app-release.apk"
            else
              APK="$RELEASE_DIR/app-release-unsigned.apk"
            fi
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi

          NAME="ghostlock-s26-${DEVICES//,/-}-${LINES//,/-}-${LABEL}-${{ inputs.build_type }}.apk"
          cp "$APK" "dist/$NAME"
          cp exploit/build/bin/preload.so dist/preload.so
          cp exploit/build/embed/su_daemon_aarch64_pie dist/su_daemon
          cp ksud-artifact/ksud dist/ksud
          cp ksud-artifact/ksud-provenance.txt dist/ksud-provenance.txt
          if ls ksud-artifact/*_kernelsu.ko >/dev/null 2>&1; then
            cp ksud-artifact/*_kernelsu.ko dist/
          fi
          cp matrix.json dist/build-matrix.json
          git rev-parse HEAD > dist/GIT_SHA

          {
            echo "GhostLock-S26 build $GITHUB_RUN_NUMBER"
            echo "git-sha=$(cat dist/GIT_SHA)"
            echo "apk=$NAME"
            echo "lines=$LINES devices=$DEVICES label=$LABEL"
            echo "build-type=${{ inputs.build_type }}"
            echo "tailor=${{ inputs.tailor }}"
            echo "ksud-sha256=${{ needs.build-ksud.outputs.ksud_sha256 }}"
            echo "--- checksums ---"
            ( cd dist && sha256sum ./* | tee CHECKSUMS.txt )
          } > dist/build-report.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-s26-dist
          path: dist/